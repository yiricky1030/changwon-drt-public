project:
  name: changwon-transit-data
  version: 1.2.0
paths:
  stop_master: data/raw/stops/stops.csv
  ridership: data/raw/ridership/ridership.csv
  processed_dir: data/processed
  release_dir: data/release
  report: reports/data_quality_report.json
  boundary_zip: data/raw/BND_ADM_DONG_PG.zip
  context_report: reports/transit_context_quality_report.json
  database_report: reports/database_load_report.json
  demographic_report: reports/transit_demographic_quality_report.json
  sgis_population_processed: data/processed/sgis_population_2024.parquet
database:
  schema: transport
matching:
  coordinate_tolerance_m: 10.0
  projected_crs: EPSG:5179
boundary:
  layer: BND_ADM_DONG_PG
  code_field: ADM_CD
  name_field: ADM_NM
  reference_date_field: BASE_DATE
  changwon_sigungu_prefixes: ["38111", "38112", "38113", "38114", "38115"]
  area_crs: EPSG:5179
  source: 국토교통부 브이월드 센서스경계 행정동경계
  source_url: https://www.vworld.kr/dtmk/dtmk_ntads_s002.do?dsId=30017
  authoritative_code_field: ADM_CD
  authoritative_name_field: ADM_NM
  external_region_prefixes:
    "21100": 부산광역시
    "21120": 부산광역시
    "38070": 김해시
    "38520": 함안군
    "38111": 창원시 내부
    "38112": 창원시 내부
    "38113": 창원시 내부
    "38114": 창원시 내부
    "38115": 창원시 내부
expected:
  observation_start: 2025-08-18
  observation_end: 2025-08-25
quality:
  max_invalid_geometry_ratio: 0.05
  max_unmatched_ratio: 0.50
time_bands:
  morning: [5, 6, 7, 8, 9]
  daytime: [10, 11, 12, 13, 14, 15, 16]
  evening: [17, 18, 19, 20, 21, 22, 23]
  late_night: [0, 1, 2, 3, 4]
